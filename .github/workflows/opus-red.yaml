# Check RED audio in real browsers and verify the WebRTC and interceptor implementations.
name: RED audio tests with Pion

on:
  workflow_dispatch:
    inputs:
      webrtc-repository:
        description: WebRTC repository to test (owner/repository)
        type: string
        default: pion/webrtc
      webrtc-ref:
        description: WebRTC branch, tag, commit, or pull request ref to test
        type: string
        default: refs/pull/3526/head
      interceptor-repository:
        description: Interceptor repository to test (owner/repository)
        type: string
        default: pion/interceptor
      interceptor-ref:
        description: Interceptor branch, tag, commit, or pull request ref to test
        type: string
        default: refs/pull/454/head
      interop-repository:
        description: Browser test repository (owner/repository); leave empty to use this repository
        type: string
        default: ''
      interop-ref:
        description: Browser test branch, tag, or commit; leave empty to use the revision running this workflow
        type: string
        default: ''
      run-soak:
        description: Also check that RED audio keeps flowing in Chrome for 30 minutes
        type: boolean
        default: false
  workflow_call:
    inputs:
      webrtc-repository:
        description: WebRTC repository to test (owner/repository)
        type: string
        default: pion/webrtc
      webrtc-ref:
        description: WebRTC branch, tag, commit, or pull request ref to test
        type: string
        default: refs/pull/3526/head
      interceptor-repository:
        description: Interceptor repository to test (owner/repository)
        type: string
        default: pion/interceptor
      interceptor-ref:
        description: Interceptor branch, tag, commit, or pull request ref to test
        type: string
        default: refs/pull/454/head
      interop-repository:
        description: Browser test repository to run (owner/repository)
        type: string
        required: true
      interop-ref:
        description: Browser test branch, tag, or commit to run
        type: string
        required: true
      run-soak:
        description: Also check that RED audio keeps flowing in Chrome for 30 minutes
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quick:
    name: 10 quick RED browser tests
    uses: ./.github/workflows/browser-tests.yaml
    with:
      webrtc-repository: ${{ inputs.webrtc-repository }}
      webrtc-ref: ${{ inputs.webrtc-ref }}
      interceptor-repository: ${{ inputs.interceptor-repository }}
      interceptor-ref: ${{ inputs.interceptor-ref }}
      interop-repository: ${{ inputs.interop-repository || github.repository }}
      interop-ref: ${{ inputs.interop-ref || github.sha }}
      require-opus-red: pion
      opus-red-suite: quick
      junit-path: .vitest-attachments/opus-red-quick.xml

  soak:
    if: inputs.run-soak
    name: Chrome RED audio for 30 minutes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the browser tests
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.interop-repository || github.repository }}
          ref: ${{ inputs.interop-ref || github.sha }}
          persist-credentials: false

      - name: Check out the WebRTC version to test
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.webrtc-repository }}
          ref: ${{ inputs.webrtc-ref }}
          path: webrtc
          persist-credentials: false

      - name: Check out the interceptor version to test
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.interceptor-repository }}
          ref: ${{ inputs.interceptor-ref }}
          path: interceptor
          persist-credentials: false

      - name: Check that RED audio keeps flowing for 30 minutes
        uses: ./
        with:
          webrtc-path: webrtc
          interceptor-path: interceptor
          browser: chrome
          require-opus-red: '1'
          opus-red-suite: soak
          junit-path: .vitest-attachments/opus-red-soak.xml

      - name: Upload Chrome audio results and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opus-red-soak-chrome
          path: |
            .vitest-attachments/
            test/**/__screenshots__/
            soak/**/__screenshots__/
          include-hidden-files: true
          if-no-files-found: warn

  upstream:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: targeted
            name: Go RED codec and recovery tests
          - check: full
            name: All WebRTC and interceptor Go tests
          - check: race
            name: Go RED tests with race detection
          - check: fuzz
            name: Fuzz interceptor RED packet parsing
    env:
      GOTOOLCHAIN: auto
      RED_GO_CHECK: ${{ matrix.check }}
    steps:
      - name: Check out the browser tests
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.interop-repository || github.repository }}
          ref: ${{ inputs.interop-ref || github.sha }}
          persist-credentials: false

      - name: Check out the WebRTC version to test
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.webrtc-repository }}
          ref: ${{ inputs.webrtc-ref }}
          path: webrtc
          persist-credentials: false

      - name: Check out the interceptor version to test
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.interceptor-repository }}
          ref: ${{ inputs.interceptor-ref }}
          path: interceptor
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Prepare a Go workspace for the selected checkouts
        id: workspace
        shell: bash
        env:
          GOWORK: 'off'
        run: |
          red_workspace=$(mktemp -d "$RUNNER_TEMP/opus-red-go.XXXXXX")
          (
            cd "$red_workspace"
            go work init "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/webrtc" "$GITHUB_WORKSPACE/interceptor"
          )
          echo "GOWORK=$red_workspace/go.work" >> "$GITHUB_ENV"
          mkdir -p .vitest-attachments
          git -C webrtc rev-parse HEAD
          git -C interceptor rev-parse HEAD

      - name: Run WebRTC Go tests
        if: matrix.check != 'fuzz'
        shell: bash
        run: |
          case "$RED_GO_CHECK" in
            targeted) args=(-count=1 -run 'RED|OpusRED' . ./internal/fmtp) ;;
            full) args=(-count=1 ./...) ;;
            race) args=(-race -count=1 -run 'RED|OpusRED' . ./internal/fmtp) ;;
          esac
          go -C webrtc test "${args[@]}" 2>&1 | tee ".vitest-attachments/upstream-$RED_GO_CHECK-webrtc.log"

      - name: Run interceptor Go checks
        if: always() && steps.workspace.outcome == 'success'
        shell: bash
        run: |
          case "$RED_GO_CHECK" in
            targeted) args=(-count=1 ./pkg/red) ;;
            full) args=(-count=1 ./...) ;;
            race) args=(-race -count=1 ./pkg/red) ;;
            fuzz) args=(-run '^$' -fuzz '^FuzzPayloadUnmarshal$' -fuzztime=60s ./pkg/red) ;;
          esac
          go -C interceptor test "${args[@]}" 2>&1 | tee ".vitest-attachments/upstream-$RED_GO_CHECK-interceptor.log"

      - name: Upload Go logs and fuzz inputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opus-red-upstream-${{ matrix.check }}
          path: |
            .vitest-attachments/upstream-*.log
            interceptor/pkg/red/testdata/fuzz/
          include-hidden-files: true
          if-no-files-found: warn
